<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nier Invaders</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="./assets/favicon.ico" />
</head>

<body>
  <div id="start-screen">
    <h1>NieR: Invaders</h1>
    <p class="screen-copy">Elegí un modo para comenzar la misión</p>
    <div class="mode-buttons">
      <button id="start-btn">Modo niveles</button>
      <button id="survival-btn">Modo libre</button>
    </div>
  </div>

  <div id="victory-screen" style="display: none;">
    <h1>¡Victoria!</h1>
    <p>Derrotaste a todos los enemigos</p>
    <button id="restart-btn">Volver a jugar</button>
  </div>

  <div id="pause-screen" class="overlay">
    <div class="menu">
      <h2>Juego en Pausa</h2>
      <button id="resume-btn">Reanudar</button>
      <button id="restart-btn-pause">Reiniciar</button>
      <button id="menu-btn">Volver al Menú</button>
    </div>
  </div>

  <div id="game">
    <div id="player"></div>
  </div>

  <audio id="bg-music" src="./assets/song.mp3" autoplay loop></audio>
  <script src="game.js"></script>
</body>

</html>
